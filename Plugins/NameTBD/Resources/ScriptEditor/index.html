<!DOCTYPE html>

<!--
	The Widget Animations panel's code editor: Monaco, the editor in VS Code, shown in the Script area through the editor's
	web browser (SWidgetAnimMonacoEditor). Loaded from disk - nothing is fetched from the internet. script_editor.js sets it
	up and talks to Unreal; see the top of that file.
-->
<html>
<head>
	<meta charset="utf-8">
	<meta http-equiv="Content-Security-Policy" content="default-src 'self' file: data: blob: 'unsafe-inline' 'unsafe-eval'">
	<link rel="stylesheet" data-name="vs/editor/editor.main" href="monaco/vs/editor/editor.main.css">
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #1c1c1c; }
		#editor { position: absolute; inset: 0; }
		#status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
			font: 12px "Segoe UI", sans-serif; color: #8a8a8a; pointer-events: none; }
	</style>
</head>
<body>
	<div id="editor"></div>
	<div id="status">Starting the code editor...</div>
	<script src="monaco/vs/loader.js"></script>
	<script src="script_editor.js"></script>
</body>
</html>
